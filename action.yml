name: otel-policy-lab
description: Evaluate OTLP JSON fixtures against telemetry governance policies in CI.

branding:
  icon: shield
  color: blue

inputs:
  collector-config:
    description: Path to the OpenTelemetry Collector config YAML.
    required: true
  input:
    description: Path to the OTLP JSON fixture.
    required: true
  policy:
    description: Path to the policy YAML.
    required: true
  report:
    description: Optional JSON report output path.
    required: false
    default: report.json
  fail-on-warn:
    description: Exit non-zero when warnings are emitted.
    required: false
    default: "false"
  validate-collector:
    description: Run otelcol validate before policy evaluation.
    required: false
    default: "false"
  otelcol-bin:
    description: Explicit preinstalled Collector binary for the real runner, or validation binary.
    required: false
    default: ""
  runner:
    description: Execution strategy (fixture or otelcol). The action never installs a Collector.
    required: false
    default: fixture
  collector-start-timeout:
    description: Maximum Collector startup time.
    default: 10s
  collector-run-timeout:
    description: Total Collector run deadline.
    default: 30s
  collector-settle-time:
    description: Settling interval before graceful shutdown.
    default: 500ms

outputs:
  report-path:
    description: Requested JSON report path; available for artifact upload with always().
    value: ${{ steps.policy-check.outputs.report-path }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version-file: ${{ github.action_path }}/go.mod

    - name: Build otel-policy-lab
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        CGO_ENABLED: "0"
        GOTOOLCHAIN: local
      run: |
        go build -ldflags "-X main.version=action" -o "${RUNNER_TEMP}/otel-policy-lab" ./cmd/otel-policy-lab

    - name: Run policy checks
      id: policy-check
      shell: bash
      env:
        COLLECTOR_CONFIG: ${{ inputs.collector-config }}
        FIXTURE_INPUT: ${{ inputs.input }}
        POLICY_INPUT: ${{ inputs.policy }}
        REPORT_PATH: ${{ inputs.report }}
        RUNNER_KIND: ${{ inputs.runner }}
        OTELCOL_BINARY: ${{ inputs.otelcol-bin }}
        FAIL_ON_WARN: ${{ inputs.fail-on-warn }}
        VALIDATE_COLLECTOR: ${{ inputs.validate-collector }}
        COLLECTOR_START_TIMEOUT: ${{ inputs.collector-start-timeout }}
        COLLECTOR_RUN_TIMEOUT: ${{ inputs.collector-run-timeout }}
        COLLECTOR_SETTLE_TIME: ${{ inputs.collector-settle-time }}
      run: |
        if [[ "$REPORT_PATH" == *$'\n'* || "$REPORT_PATH" == *$'\r'* ]]; then
          echo "Report path must not contain newlines" >&2
          exit 2
        fi
        printf 'report-path=%s\n' "$REPORT_PATH" >> "$GITHUB_OUTPUT"
        args=(
          test
          --collector-config "$COLLECTOR_CONFIG"
          --input "$FIXTURE_INPUT"
          --policy "$POLICY_INPUT"
          --report "$REPORT_PATH"
          --runner "$RUNNER_KIND"
          --fail-on-warn="$FAIL_ON_WARN"
          --collector-start-timeout "$COLLECTOR_START_TIMEOUT"
          --collector-run-timeout "$COLLECTOR_RUN_TIMEOUT"
          --collector-settle-time "$COLLECTOR_SETTLE_TIME"
        )
        if [[ -n "$OTELCOL_BINARY" ]]; then
          args+=(--otelcol-bin "$OTELCOL_BINARY")
        fi
        if [[ "$VALIDATE_COLLECTOR" == "true" ]]; then
          args+=(--validate-collector)
        fi
        "${RUNNER_TEMP}/otel-policy-lab" "${args[@]}"
